[build]
  command = "npm run build"
  publish = ".next"

# Public anon key — safe to expose (browser-side); RLS protects writes.
[build.environment]
  NEXT_PUBLIC_SUPABASE_URL = "https://ogdgvnnjbjwrbaobharh.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nZGd2bm5qYmp3cmJhb2JoYXJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3OTY5MDgsImV4cCI6MjA5NzM3MjkwOH0.CluVGdlwng_foJAx-8cAIakHbaX9MPMCSVyt7kpHheU"
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# admin.vasfiy.com → /admin is handled by Next middleware (src/middleware.ts).

# Seed SQL served with CORS so it can be fetched from the Supabase SQL editor.
[[headers]]
  for = "/market-seed.sql"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "text/plain; charset=utf-8"

# ---- Caching ----------------------------------------------------------------
# Content-addressed build output never changes under a given URL.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static media in /public: served from the CDN edge, revalidated in the
# background so a burst of traffic never reaches the origin for the same file.
[[headers]]
  for = "/certs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/market-seed/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Security headers — cheap, and they keep the admin/market hosts honest.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
