<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- shield monogram -->
  <g transform="translate(90,86)">
    <path d="M40 0 L78 15 V52 C78 86 60 108 40 118 C20 108 2 86 2 52 V15 Z" fill="url(#accent)"/>
    <text x="40" y="72" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#07101a" text-anchor="middle">KT</text>
  </g>

  <!-- status -->
  <g transform="translate(90,250)">
    <rect x="0" y="0" width="360" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="26" cy="22" r="6" fill="#45f0a0"/>
    <text x="46" y="29" font-family="Arial, sans-serif" font-size="18" fill="#a9b4cf">Open to relocation · Europe</text>
  </g>

  <text x="88" y="380" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#eaf0ff">Kamoliddin Tilonboyev</text>
  <text x="90" y="438" font-family="monospace" font-size="30" fill="url(#accent)">SOC Analyst · Blue-Team · Cybersecurity</text>

  <text x="90" y="510" font-family="Arial, sans-serif" font-size="24" fill="#a9b4cf">TryHackMe global top 1% · Wireshark · SIEM · Python automation</text>
  <text x="90" y="556" font-family="monospace" font-size="22" fill="#6c7793">vasfiy.uz</text>
</svg>
