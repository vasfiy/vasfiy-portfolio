<style>
:root{
  --chrome:#7A1F3D; --chrome-hi:#9C2B50; --chrome-ink:#FBEEF3;
  --ground:#EDEFF2; --panel:#FFFFFF; --panel-2:#F6F8FA;
  --ink:#16202B; --ink-2:#4E5C6B; --ink-3:#77848F;
  --line:#C4CCD4; --line-2:#DFE4E9;
  --accent:#A32B57; --accent-soft:#FAE8EF;
  --mark:#8A5D0A; --mark-soft:#FBF0D8;
  --ok:#186A45; --ok-soft:#E2F1E9;
  --bad:#96292A; --bad-soft:#F8E7E7;
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --serif:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --chrome:#3D1220; --chrome-hi:#5E1D33; --chrome-ink:#F3DDE5;
    --ground:#0E1319; --panel:#161D25; --panel-2:#1C242E;
    --ink:#DFE5EB; --ink-2:#9AA7B4; --ink-3:#77838F;
    --line:#2E3944; --line-2:#232C36;
    --accent:#E88CAC; --accent-soft:#2E1721;
    --mark:#D6A445; --mark-soft:#2C2513;
    --ok:#5CBE92; --ok-soft:#14261E;
    --bad:#E58585; --bad-soft:#2A1717;
  }
}
:root[data-theme="dark"]{
  --chrome:#3D1220; --chrome-hi:#5E1D33; --chrome-ink:#F3DDE5;
  --ground:#0E1319; --panel:#161D25; --panel-2:#1C242E;
  --ink:#DFE5EB; --ink-2:#9AA7B4; --ink-3:#77838F;
  --line:#2E3944; --line-2:#232C36;
  --accent:#E88CAC; --accent-soft:#2E1721;
  --mark:#D6A445; --mark-soft:#2C2513;
  --ok:#5CBE92; --ok-soft:#14261E;
  --bad:#E58585; --bad-soft:#2A1717;
}
:root[data-theme="light"]{
  --chrome:#7A1F3D; --chrome-hi:#9C2B50; --chrome-ink:#FBEEF3;
  --ground:#EDEFF2; --panel:#FFFFFF; --panel-2:#F6F8FA;
  --ink:#16202B; --ink-2:#4E5C6B; --ink-3:#77848F;
  --line:#C4CCD4; --line-2:#DFE4E9;
  --accent:#A32B57; --accent-soft:#FAE8EF;
  --mark:#8A5D0A; --mark-soft:#FBF0D8;
  --ok:#186A45; --ok-soft:#E2F1E9;
  --bad:#96292A; --bad-soft:#F8E7E7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.55}
.app{min-height:100dvh;display:flex;flex-direction:column}

.chrome{background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid rgba(0,0,0,.35)}
.chrome-in{width:100%;padding:12px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chrome-title{font-size:16px;font-weight:600;letter-spacing:.2px;flex:1;min-width:220px}
.chrome-title span{display:block;font-weight:400;font-size:13px;opacity:.72;letter-spacing:.3px}
.meter{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;background:rgba(255,255,255,.1);padding:6px 12px;border:1px solid rgba(255,255,255,.16)}
.meter b{font-weight:600}
.meter.low{background:rgba(214,120,80,.28);border-color:rgba(255,180,150,.45)}
.chrome button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:var(--chrome-ink);font-size:13px;padding:6px 12px;cursor:pointer}
.chrome button:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}

main{flex:1;width:100%;padding:24px 28px 36px}
.pane{background:var(--panel);border:1px solid var(--line);padding:26px 30px}
.pane+.pane{margin-top:16px}

h1{font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-.3px;text-wrap:balance}
h2{font-weight:600;margin:0 0 14px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2);font-size:13px}
h3{font-size:19px;font-weight:600;margin:0 0 8px}
p{margin:0 0 12px}
.lede{color:var(--ink-2);margin:0 0 20px;max-width:78ch;font-size:17px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}

.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.card{background:var(--panel);border:1px solid var(--line);padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.card .n{font-family:var(--mono);font-size:13px;color:var(--ink-3);letter-spacing:.5px}
.card h3{margin:0}
.card ul{margin:0;padding-left:20px;color:var(--ink-2);font-size:16px}
.card li{margin-bottom:3px}
.card.pick{cursor:pointer;transition:border-color .15s,transform .15s}
.card.pick:hover{border-color:var(--accent);transform:translateY(-2px)}

button{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:10px 20px;cursor:pointer;border-radius:2px}
button:hover{background:var(--accent-soft);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.1)}
button.danger{color:var(--bad);border-color:var(--line)}
button.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:7px 10px;border-radius:2px;width:100%}
textarea{font-family:var(--ui);font-size:16px;line-height:1.6;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.hint{font-size:12px;color:var(--ink-3);margin-top:4px}

/* ---- Reading: split pane ---- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);background:var(--panel);min-height:60vh}
.split>div{padding:22px 26px;overflow-y:auto;max-height:calc(100dvh - 230px)}
.split .passage{border-right:1px solid var(--line-2)}
.passage h3{font-family:var(--serif);font-size:22px;margin-bottom:4px}
.passage .ptext{font-family:var(--serif);font-size:17.5px;line-height:1.72}
.passage .ptext p{margin:0 0 14px}
.passage .para-label{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);margin-right:8px}
.qpanel .qgroup{border-bottom:1px solid var(--line-2);padding-bottom:20px;margin-bottom:20px}
.qpanel .qgroup:last-child{border-bottom:0}
.grp-head{font-weight:600;margin:0 0 6px}
.grp-instr{color:var(--ink-2);font-size:15.5px;margin:0 0 14px}
.qrow{margin-bottom:16px}
.qrow .qn{font-family:var(--mono);font-size:13px;color:var(--ink-3);letter-spacing:.6px}
.qrow .qt{margin:2px 0 8px;font-size:16.5px;line-height:1.5}

.opts{display:flex;flex-direction:column;gap:3px;margin:0 0 4px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border:1px solid transparent;cursor:pointer;line-height:1.5;font-size:16.5px}
.opt:hover{background:var(--panel-2)}
.opt input{margin:4px 0 0;flex:none;accent-color:var(--accent);width:16px;height:16px}
.opt .lt{font-family:var(--mono);font-size:15px;color:var(--ink-3);flex:none;min-width:18px}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.inline-opts{display:flex;gap:8px;flex-wrap:wrap}
.inline-opts button{padding:6px 14px;font-size:15px;font-family:var(--mono)}
.inline-opts button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.gap{max-width:260px;font-family:var(--mono);font-size:16px;display:inline-block;width:auto;min-width:170px}
.dropsel{max-width:340px}

.exhibit{background:var(--panel-2);border:1px solid var(--line-2);border-left:3px solid var(--accent);padding:14px 16px;margin:0 0 16px;font-size:16px;line-height:1.6}
.exhibit.mono{font-family:var(--mono);font-size:14.5px;white-space:pre;overflow-x:auto}
.exhibit ul{margin:6px 0 0;padding-left:20px}
.notice{font-size:15px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line-2);border-left:3px solid var(--accent);padding:12px 16px;margin:0 0 18px}

.footbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);margin-top:16px}
.footbar-in{width:100%;padding:14px 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.markbox{display:flex;gap:9px;align-items:center;font-size:16px;cursor:pointer;padding:9px 14px;border:1px solid var(--line)}
.markbox input{accent-color:var(--mark);width:16px;height:16px}
.markbox.on{background:var(--mark-soft);border-color:var(--mark);color:var(--mark);font-weight:600}
.palette{display:flex;gap:5px;flex-wrap:wrap}
.palette button{width:34px;height:32px;padding:0;font-family:var(--mono);font-size:13px;border-radius:2px}
.palette button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.palette button.mark{background:var(--mark-soft);border-color:var(--mark);color:var(--mark)}
.palette button.cur{outline:2px solid var(--ink);outline-offset:1px}

table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2)}
th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);font-weight:600}
tbody tr:hover{background:var(--panel-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3)}
.pill{display:inline-block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;padding:3px 10px;border:1px solid var(--line)}
.pill.a{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill.u{color:var(--ink-3)}
.pill.m{background:var(--mark-soft);border-color:var(--mark);color:var(--mark)}
.pill.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pill.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

.stat{background:var(--panel-2);border:1px solid var(--line-2);padding:16px 20px}
.stat .k{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.stat .v{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)}
.band-big{font-size:56px;font-weight:700;letter-spacing:-2px;color:var(--accent);line-height:1}

.bar{height:10px;background:var(--panel-2);border:1px solid var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>i.ok{background:var(--ok)} .bar>i.bad{background:var(--bad)}
.brow{display:grid;grid-template-columns:minmax(160px,260px) 1fr 78px;gap:14px;align-items:center;margin-bottom:11px;font-size:16px}
.brow .sc{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:15px;color:var(--ink-2)}

.rev{border:1px solid var(--line-2);padding:16px 20px;margin-bottom:12px}
.rev.right{border-left:3px solid var(--ok)}
.rev.wrong{border-left:3px solid var(--bad)}
.rev .rq{font-size:16.5px;margin:8px 0 10px}
.rev .ans{font-size:16px;margin:0 0 5px}
.rev .ans b{font-weight:600}
.exp{font-size:15.5px;color:var(--ink-2);background:var(--panel-2);border-top:1px solid var(--line-2);margin:12px -20px -16px;padding:13px 20px}

/* ---- Writing ---- */
.wr-wrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}
.wr-prompt{background:var(--panel);border:1px solid var(--line);padding:22px 26px;position:sticky;top:16px;max-height:calc(100dvh - 200px);overflow-y:auto}
.wr-editor{background:var(--panel);border:1px solid var(--line);padding:22px 26px}
.wr-editor textarea{min-height:52vh}
.wc{font-family:var(--mono);font-size:14px;color:var(--ink-2);display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px}
.wc b{font-variant-numeric:tabular-nums;font-size:17px;color:var(--ink)}
.wc .short{color:var(--bad)}
.wc .good{color:var(--ok)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:15.5px;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin-top:3px;flex:none}
.model{font-family:var(--serif);font-size:17px;line-height:1.7;background:var(--panel-2);border:1px solid var(--line-2);padding:18px 22px}
.model p{margin:0 0 13px}

/* ---- Speaking ---- */
.cue{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:22px 26px;font-size:18px;line-height:1.6}
.cue ul{margin:10px 0 0;padding-left:22px}
.cue li{margin-bottom:4px}
.big-timer{font-family:var(--mono);font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-1px;text-align:center;margin:14px 0}
.big-timer.warn{color:var(--bad)}
.phase{text-align:center;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);font-family:var(--mono)}
audio{width:100%;margin-top:12px}

/* ---- Vocabulary ---- */
.flash{background:var(--panel);border:1px solid var(--line);padding:34px 30px;min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.flash .word{font-size:34px;font-weight:600;letter-spacing:-.5px;margin-bottom:6px}
.flash .pos{font-family:var(--mono);font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
.flash .def{font-size:18px;color:var(--ink-2);max-width:60ch;margin:0 auto 12px}
.flash .ex{font-family:var(--serif);font-size:17px;color:var(--ink-2);font-style:italic;max-width:62ch;margin:0 auto}
.flash .coll{font-family:var(--mono);font-size:14px;color:var(--accent);margin-top:14px}
.flash .tap{font-size:13px;color:var(--ink-3);margin-top:18px;font-family:var(--mono);letter-spacing:.5px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .split .passage{border-right:0;border-bottom:1px solid var(--line-2)}
  .split>div{max-height:none}
  .wr-wrap{grid-template-columns:1fr}
  .wr-prompt{position:static;max-height:none}
}
@media (max-width:700px){
  .chrome-in{gap:10px;padding:10px 14px}
  main{padding:16px 14px 26px}
  .pane{padding:18px 16px}
  .footbar-in{padding:12px 14px}
  .split>div{padding:16px 14px}
  .band-big{font-size:44px}
}
</style>

<script>
/* =====================================================================
   IELTS Academic practice platform.
   All passages, questions, model answers and vocabulary below are
   original material written for this site in the style of the exam —
   no Cambridge/IDP test content is reproduced.
   ===================================================================== */

/* ============ READING ============ */
var READING = [
{
  id:"R1", title:"The Return of the Urban Tram", minutes:20,
  intro:"You should spend about 20 minutes on Questions 1–13, which are based on the passage below.",
  paras:[
   ["A","For most of the twentieth century the tram was treated as an embarrassment. Cities from Sydney to Stockholm tore up their networks in the decades after 1945, convinced that steel rails belonged to a slower age. The private car promised freedom; the bus promised flexibility at a fraction of the capital cost. By 1970 fewer than a dozen British towns retained any tram service at all, and the vehicles that survived did so largely as museum pieces."],
   ["B","The reversal, when it came, was driven less by nostalgia than by arithmetic. A modern tram can carry between 200 and 300 passengers, roughly the load of three articulated buses, while occupying a single driver's wage. Because the vehicle runs on a fixed and visible route, planners can predict demand along a corridor with a precision that bus networks rarely allow. Property developers noticed this first: land within 400 metres of a proposed tram stop in Manchester rose in value long before the first rail was laid."],
   ["C","Cost, however, remains the central objection. A kilometre of new tramway in Western Europe typically costs between 15 and 30 million euros, and the figure climbs steeply where utilities must be diverted. Critics point out that a bus lane delivering comparable capacity can be painted onto an existing road in a matter of weeks. Advocates reply that the comparison is misleading: buses depreciate over roughly twelve years, whereas tram vehicles routinely serve for thirty and the track itself for considerably longer."],
   ["D","There is also the question of who actually changes their behaviour. Surveys conducted in Nantes, Bordeaux and Freiburg consistently show that new tram lines attract a group of passengers that bus improvements do not reach — people who own a car and could drive but choose not to. Transport economists call this the rail factor, and although its size is disputed, its existence is not. The most cautious estimates suggest that a tram line attracts perhaps fifteen per cent more former drivers than an identical bus corridor; the most enthusiastic put the figure above forty."],
   ["E","Explanations for the rail factor vary. Some researchers emphasise ride quality: a tram running on welded rail produces less lateral movement, allowing passengers to read or work. Others point to what might be called institutional confidence. Rails cannot be quietly rerouted after an election, so a household deciding where to live can treat the line as a fixed feature of the city. Dr Helena Vaarst, whose 2019 study compared eleven European corridors, argues that this permanence is worth more than any engineering advantage: passengers, she writes, are responding to a promise rather than to a vehicle."],
   ["F","Not every project has succeeded. Edinburgh's line, opened in 2014 after years of dispute, ran roughly three times over its original budget and reached barely half of its planned length. The Sheffield Supertram carried far fewer passengers in its early years than forecast, in part because the city's steep gradients and dispersed employment sites suited it poorly. Such cases suggest that the tram is not a universal solution but a corridor tool, effective where a dense line of demand already exists and unconvincing where it does not."],
   ["G","The most recent generation of schemes has therefore grown more modest in ambition and more careful in execution. Rather than building a network at once, cities such as Besançon and Aarhus opened a single line, priced conservatively, and expanded only after ridership was established. Besançon's route, delivered for under 17 million euros per kilometre, is now cited across the sector as evidence that the costs of the 1990s were a matter of specification rather than of the technology itself."]
  ],
  groups:[
   {
     head:"Questions 1–5", type:"tfng",
     instr:"Do the following statements agree with the information given in the passage? Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, or NOT GIVEN if there is no information on this.",
     items:[
       {n:1, q:"Most British towns had abandoned their tram services by 1970.", a:"TRUE",
        why:"Paragraph A states that by 1970 'fewer than a dozen British towns retained any tram service at all', which agrees with the statement."},
       {n:2, q:"A modern tram requires fewer drivers than buses carrying the same number of passengers.", a:"TRUE",
        why:"Paragraph B says a tram carries the load of three articulated buses 'while occupying a single driver's wage' — one driver instead of three."},
       {n:3, q:"Land values near planned tram stops in Manchester fell before construction began.", a:"FALSE",
        why:"Paragraph B says land within 400 metres of a proposed stop 'rose in value long before the first rail was laid' — the opposite of falling."},
       {n:4, q:"Diverting utility pipes and cables is the largest single cost in tramway construction.", a:"NOT GIVEN",

 {w:"proliferation", pos:"noun", def:"rapid increase in the number of something", ex:"The proliferation of delivery apps has changed city traffic.", coll:"the proliferation of · rapid proliferation"},
 {w:"pragmatic", pos:"adjective", def:"dealing with matters in a practical rather than theoretical way", ex:"They took a pragmatic approach and fixed the worst problems first.", coll:"a pragmatic approach / solution"},
 {w:"contentious", pos:"adjective", def:"causing or likely to cause disagreement", ex:"Road pricing remains a contentious issue in most cities.", coll:"a contentious issue / topic / claim"},
 {w:"offset", pos:"verb", def:"to balance one effect against an opposing one", ex:"Higher fuel costs were offset by lower maintenance bills.", coll:"offset the cost / the loss / the increase"},
 {w:"unprecedented", pos:"adjective", def:"never having happened before", ex:"The region experienced unprecedented levels of rainfall.", coll:"unprecedented growth / demand / scale"},
 {w:"reluctant", pos:"adjective", def:"unwilling and hesitant", ex:"Many households are reluctant to give up their second car.", coll:"reluctant to do · increasingly reluctant"},
 {w:"feasible", pos:"adjective", def:"possible to do easily or conveniently", ex:"It is not financially feasible to extend the line further.", coll:"technically / economically feasible"},
 {w:"cumulative", pos:"adjective", def:"increasing by successive additions", ex:"The cumulative effect of small delays was significant.", coll:"cumulative effect / impact / total"},
 {w:"comprehensive", pos:"adjective", def:"complete; including all or nearly all elements", ex:"The report offers a comprehensive review of the evidence.", coll:"a comprehensive review / survey / approach"},
 {w:"anomaly", pos:"noun", def:"something that deviates from what is standard or expected", ex:"The 2019 figure is an anomaly and should be treated with caution.", coll:"a statistical anomaly · an apparent anomaly"},
 {w:"consensus", pos:"noun", def:"general agreement among a group", ex:"There is now a broad consensus that the policy failed.", coll:"reach / build a consensus · broad consensus"},
 {w:"paramount", pos:"adjective", def:"more important than anything else", ex:"Passenger safety is paramount in any transport decision.", coll:"of paramount importance · paramount concern"}
];

var chCount = document.getElementById("chCount"), chTime = document.getElementById("chTime");

var chSub = document.getElementById("chSub");

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function norm(s){ return String(s||"").trim().toLowerCase().replace(/[.,!?;:'"()]/g,"").replace(/\s+/g," "); }
function fmt(sec){ sec=Math.max(0,sec|0); var m=(sec/60)|0, s=sec%60; return m+":"+(s<10?"0":"")+s; }
function toggleNight(){ var d=document.documentElement, dark=d.getAttribute("data-theme")==="dark"; d.setAttribute("data-theme",dark?"light":"dark"); try{localStorage.setItem("ielts-theme",dark?"light":"dark");}catch(e){} }
function toggleFull(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
try{ var st=localStorage.getItem("ielts-theme"); if(st) document.documentElement.setAttribute("data-theme",st); }catch(e){}

function stopTimer(){ if(S.tick){ clearInterval(S.tick); S.tick=null; } chTime.hidden=true; chTime.classList.remove("low"); }
function startTimer(mins, onEnd){
  S.endAt = Date.now()+mins*60000; chTime.hidden=false;
  var run=function(){
    var left=Math.round((S.endAt-Date.now())/1000);
    mTime.textContent=fmt(left);
    chTime.classList.toggle("low", left<=300);
    if(left<=0){ stopTimer(); onEnd&&onEnd(); }
  };
  run(); S.tick=setInterval(run,1000);
}

/* Band conversion — Academic Reading and Listening (standard public tables) */
function bandFromRaw(raw, kind){
  var T = kind==="listening"
    ? [[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4]]
    : [[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4]];
  for(var i=0;i<T.length;i++) if(raw>=T[i][0]) return T[i][1];
  return raw>=6?3.5:3;
}
/* Scale a short practice set onto the 40-question table so the band stays meaningful */
function bandScaled(correct, total, kind){ return bandFromRaw(Math.round(correct/total*40), kind); }

function openReadingMenu(){
  chSub.textContent="Academic Reading";
  view.innerHTML='<div class="pane"><p class="eyebrow">Academic Reading</p><h1>Choose a passage</h1>'+

   '<div class="grid grid-2">'+READING.map(function(r,i){
     var n=r.groups.reduce(function(a,g){return a+g.items.length;},0);
     return '<div class="card pick" onclick="startReading('+i+')" role="button" tabindex="0"><div class="n">PASSAGE '+(i+1)+'</div><h3>'+esc(r.title)+'</h3>'+
      '<p style="color:var(--ink-2);font-size:16px;margin:0">'+n+' questions · '+r.minutes+' minutes</p>'+

function typeLabel(g){
  if(g.type==="tfng") return g.ynng?"Yes/No/Not Given":"True/False/Not Given";
  if(g.type==="para") return "Matching information";
  if(g.type==="gap") return "Sentence completion";
  if(g.type==="mc") return "Multiple choice";
  if(g.type==="summary") return "Summary completion";
  return g.type;
}
function startReading(idx){
  S.mode="reading"; S.test=READING[idx]; S.ans={}; S.submitted=false;
  S.qs=[]; S.test.groups.forEach(function(g){ g.items.forEach(function(it){ S.qs.push({g:g,it:it}); }); });
  chSub.textContent="Academic Reading — "+S.test.title;
  startTimer(S.test.minutes, function(){ submitReading(); });
  renderReading();
}
function renderReading(){
  var t=S.test;
  var passage='<div class="passage"><h3>'+esc(t.title)+'</h3><p class="hint" style="margin-bottom:14px">'+esc(t.intro)+'</p><div class="ptext">'+
    t.paras.map(function(p){ return '<p><span class="para-label">'+p[0]+'</span>'+esc(p[1])+'</p>'; }).join("")+'</div></div>';
  var qhtml=t.groups.map(function(g){
    return '<div class="qgroup"><p class="grp-head">'+esc(g.head)+'</p><p class="grp-instr">'+esc(g.instr)+'</p>'+
      (g.title?'<p style="font-weight:600;margin:0 0 10px">'+esc(g.title)+'</p>':'')+
      g.items.map(function(it){ return renderQ(g,it); }).join("")+'</div>';
  }).join("");
  view.innerHTML='<div class="split">'+passage+'<div class="qpanel">'+qhtml+'</div></div>';
  foot.hidden=false;
  footIn.innerHTML='<div class="palette">'+S.qs.map(function(q){
      var done=S.ans[q.it.n]!=null&&S.ans[q.it.n]!=="";
      return '<button class="'+(done?"done":"")+'" onclick="jumpQ('+q.it.n+')">'+q.it.n+'</button>';
    }).join("")+'</div><span class="spacer"></span>'+
    '<button class="primary" onclick="submitReading()">Submit answers</button>'+
    '<button class="danger" onclick="if(confirm(\'Leave this passage? Your answers will be lost.\'))home()">Quit</button>';
  chCount.hidden=false; mTot.textContent=S.qs.length; mCur.textContent=Object.keys(S.ans).filter(function(k){return S.ans[k]!==""&&S.ans[k]!=null;}).length;
}
function renderQ(g,it){
  var n=it.n, v=S.ans[n];
  var head='<div class="qrow" id="q'+n+'"><div class="qn">QUESTION '+n+'</div>';
  if(g.type==="tfng"){
    var opts=g.ynng?["YES","NO","NOT GIVEN"]:["TRUE","FALSE","NOT GIVEN"];
    return head+'<div class="qt">'+esc(it.q)+'</div><div class="inline-opts">'+
      opts.map(function(o){ return '<button class="'+(v===o?"sel":"")+'" onclick="setAns('+n+',\''+o+'\')">'+o+'</button>'; }).join("")+'</div></div>';
  }
  if(g.type==="para"){
    return head+'<div class="qt">'+esc(it.q)+'</div><div class="inline-opts">'+
      g.letters.map(function(L){ return '<button class="'+(v===L?"sel":"")+'" onclick="setAns('+n+',\''+L+'\')">'+L+'</button>'; }).join("")+'</div></div>';
  }
  if(g.type==="mc"){
    return head+'<div class="qt">'+esc(it.q)+'</div><div class="opts">'+
      it.opts.map(function(o,i){
        return '<label class="opt'+(v===i?" sel":"")+'"><input type="radio" name="q'+n+'" '+(v===i?"checked":"")+' onchange="setAns('+n+','+i+')"><span class="lt">'+"ABCD"[i]+'</span><span>'+esc(o)+'</span></label>';
      }).join("")+'</div></div>';
  }
  /* gap / summary */
  return head+'<div class="qt">'+esc(it.pre||"")+' <input class="gap" type="text" value="'+esc(v||"")+'" oninput="setAns('+n+',this.value)" autocomplete="off" spellcheck="false"> '+esc(it.post||"")+'</div></div>';
}
function setAns(n,v){ S.ans[n]=v; if(S.mode==="reading") refreshPalette(); else if(S.mode==="listening") refreshPalette(); syncSelections(); }
function syncSelections(){
  /* re-render only the inline button states, keeping typed text intact */
  S.qs.forEach(function(q){
    var el=document.getElementById("q"+q.it.n); if(!el) return;
    var btns=el.querySelectorAll(".inline-opts button");
    btns.forEach(function(b){ b.classList.toggle("sel", b.textContent===String(S.ans[q.it.n])); });
    var labels=el.querySelectorAll(".opt");
    labels.forEach(function(l,i){ l.classList.toggle("sel", S.ans[q.it.n]===i); });
  });
}
function refreshPalette(){
  var btns=footIn.querySelectorAll(".palette button");
  S.qs.forEach(function(q,i){ if(btns[i]) btns[i].classList.toggle("done", S.ans[q.it.n]!=null&&S.ans[q.it.n]!==""); });
  mCur.textContent=Object.keys(S.ans).filter(function(k){return S.ans[k]!==""&&S.ans[k]!=null;}).length;
}
function jumpQ(n){ var el=document.getElementById("q"+n); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); }

function gradeItem(g,it){
  var v=S.ans[it.n];
  if(g.type==="mc") return v===it.a;
  if(g.type==="tfng"||g.type==="para") return String(v||"")===it.a;
  return (it.a||[]).some(function(x){ return norm(x)===norm(v); });
}
function submitReading(){
  if(S.submitted) return;
  if(!S.submitted && Object.keys(S.ans).length<S.qs.length && !confirm("You have not answered every question. Submit anyway?")) return;
  S.submitted=true; stopTimer(); foot.hidden=true; chCount.hidden=true;
  var correct=0, rows=[];
  S.test.groups.forEach(function(g){ g.items.forEach(function(it){
    var ok=gradeItem(g,it); if(ok) correct++;
    rows.push({g:g,it:it,ok:ok,given:S.ans[it.n]});
  }); });
  var total=S.qs.length, band=bandScaled(correct,total,"reading");
  view.innerHTML='<div class="pane">'+
    '<p class="eyebrow">Result — '+esc(S.test.title)+'</p><h1>'+correct+' of '+total+' correct</h1>'+
    '<div class="grid grid-4" style="margin:18px 0 6px">'+
      '<div class="stat"><div class="k">Raw score</div><div class="v">'+correct+'/'+total+'</div></div>'+
      '<div class="stat"><div class="k">Equivalent band</div><div class="v band-big" style="font-size:32px">'+band.toFixed(1)+'</div></div>'+
      '<div class="stat"><div class="k">Accuracy</div><div class="v '+(correct/total>=.7?"ok":"bad")+'">'+Math.round(correct/total*100)+'%</div></div>'+
      '<div class="stat"><div class="k">Scaled from</div><div class="v" style="font-size:20px">'+total+' → 40 questions</div></div>'+
    '</div>'+
    '<p class="hint">The band shown scales this practice set onto the official 40-question Academic Reading table. A full test uses your real raw score out of 40.</p>'+
   '</div>'+
   '<div class="pane"><h2>Answer review</h2>'+rows.map(function(r){
      var given=r.given==null||r.given===""?"(no answer)":(r.g.type==="mc"?"ABCD"[r.given]+". "+r.it.opts[r.given]:r.given);
      var right=r.g.type==="mc"?"ABCD"[r.it.a]+". "+r.it.opts[r.it.a]:(Array.isArray(r.it.a)?r.it.a[0]:r.it.a);
      var qtext=r.it.q||((r.it.pre||"")+" ______ "+(r.it.post||""));
      return '<div class="rev '+(r.ok?"right":"wrong")+'">'+
        '<span class="pill '+(r.ok?"ok":"bad")+'">Q'+r.it.n+' '+(r.ok?"correct":"incorrect")+'</span>'+
        '<p class="rq">'+esc(qtext)+'</p>'+
        '<p class="ans"><b>Your answer:</b> '+esc(given)+'</p>'+
        (r.ok?"":'<p class="ans"><b>Correct answer:</b> '+esc(right)+'</p>')+
        '<div class="exp">'+esc(r.it.why)+'</div></div>';
    }).join("")+'</div>'+
   '<div class="pane"><div class="btnrow"><button class="primary" onclick="openReadingMenu()">Another passage</button><button onclick="home()">Home</button></div></div>';
  window.scrollTo(0,0);
}

function playAudio(){
  if(!("speechSynthesis" in window)){ showTranscript(); return; }
  if(LS.done){ alert("In the real test the recording plays only once. Submit your answers, then use Show transcript to check."); return; }
  if(LS.playing) return;
  var u=new SpeechSynthesisUtterance(S.test.script);
  u.rate=0.92; u.pitch=1; u.lang="en-GB";
  var vs=speechSynthesis.getVoices(), pick=vs.find(function(v){return /en-GB/i.test(v.lang);})||vs.find(function(v){return /^en/i.test(v.lang);});
  if(pick) u.voice=pick;
  u.onend=function(){ LS.playing=false; LS.done=true; setState("Recording finished"); document.getElementById("btnPlay").disabled=true; };
  u.onerror=function(){ LS.playing=false; setState("Playback failed — use Show transcript"); };
  LS.utter=u; LS.playing=true; setState("Playing…");
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function setState(s){ var el=document.getElementById("lsState"); if(el) el.textContent=s; }

   '<div class="pane"><h2>Answer review</h2>'+rows.map(function(r){
      var given=r.given==null||r.given===""?"(no answer)":(r.g.type==="mc"?"ABC"[r.given]+". "+r.it.opts[r.given]:r.given);
      var right=r.g.type==="mc"?"ABC"[r.it.a]+". "+r.it.opts[r.it.a]:(Array.isArray(r.it.a)?r.it.a[0]:r.it.a);
      var qtext=r.it.q||((r.it.pre||"")+" ______ "+(r.it.post||""));
      return '<div class="rev '+(r.ok?"right":"wrong")+'">'+
        '<span class="pill '+(r.ok?"ok":"bad")+'">Q'+r.it.n+' '+(r.ok?"correct":"incorrect")+'</span>'+
        '<p class="rq">'+esc(qtext)+'</p>'+
        '<p class="ans"><b>Your answer:</b> '+esc(given)+'</p>'+
        (r.ok?"":'<p class="ans"><b>Correct answer:</b> '+esc(right)+'</p>')+

      '<p style="color:var(--ink-2);font-size:16px;margin:0">'+w.minutes+' minutes · minimum '+w.minWords+' words</p></div>';
   }).join("")+'</div>'+
   '<div class="btnrow" style="margin-top:18px"><button onclick="home()">← Back</button></div></div>';
}
function startWriting(idx){
  S.mode="writing"; S.test=WRITING[idx]; S.submitted=false;
  chSub.textContent="Writing — "+S.test.title;
  var w=S.test;
  var dataTable = w.data ? '<table style="margin:6px 0 16px"><thead><tr>'+w.data[0].map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+'</tr></thead><tbody>'+
      w.data.slice(1).map(function(r){ return "<tr>"+r.map(function(c,i){ return i===0?"<td>"+esc(c)+"</td>":'<td class="num">'+esc(c)+"</td>"; }).join("")+"</tr>"; }).join("")+'</tbody></table>' : "";
  view.innerHTML='<div class="wr-wrap">'+
    '<div class="wr-prompt">'+
      '<p class="eyebrow">Task '+w.task+' · '+w.minutes+' minutes</p>'+
      '<h3>'+esc(w.title)+'</h3>'+
      '<p style="white-space:pre-line;font-size:16.5px">'+esc(w.prompt)+'</p>'+
      dataTable+
      '<h2 style="margin-top:20px">Before you submit</h2>'+
      w.checks.map(function(c,i){ return '<label class="chk"><input type="checkbox" id="chk'+i+'"><span>'+esc(c)+'</span></label>'; }).join("")+
    '</div>'+
    '<div class="wr-editor">'+
      '<textarea id="wrText" placeholder="Write your answer here…" oninput="countWords()"></textarea>'+
      '<div class="wc"><span>Words: <b id="wcN">0</b></span><span id="wcMsg" class="short">minimum '+w.minWords+'</span><span>Paragraphs: <b id="wcP">0</b></span></div>'+
      '<div class="btnrow" style="margin-top:14px">'+
        '<button class="primary" onclick="finishWriting()">Finish &amp; see model answer</button>'+
        '<button onclick="if(confirm(\'Leave this task? Your text will be lost.\'))home()">Quit</button>'+
      '</div>'+
    '</div>'+
   '</div>';
  foot.hidden=true;
  startTimer(w.minutes, function(){ alert("Time is up. In the real test you would have to stop writing now."); });
  countWords();
}
function countWords(){
  var t=document.getElementById("wrText"); if(!t) return;
  var words=t.value.trim()?t.value.trim().split(/\s+/).length:0;
  var paras=t.value.trim()?t.value.trim().split(/\n\s*\n/).filter(function(p){return p.trim();}).length:0;
  document.getElementById("wcN").textContent=words;
  document.getElementById("wcP").textContent=paras;
  var msg=document.getElementById("wcMsg"), min=S.test.minWords;
  if(words>=min){ msg.textContent="minimum met"; msg.className="good"; }
  else { msg.textContent=(min-words)+" more to reach "+min; msg.className="short"; }
}
function finishWriting(){
  var t=document.getElementById("wrText"), text=t?t.value:"";
  var words=text.trim()?text.trim().split(/\s+/).length:0;
  stopTimer();
  var w=S.test;
  var penalty=words<w.minWords;
  view.innerHTML='<div class="pane">'+
     '<p class="eyebrow">'+esc(w.title)+'</p><h1>Your answer</h1>'+
     '<div class="grid grid-3" style="margin:14px 0">'+
       '<div class="stat"><div class="k">Words written</div><div class="v '+(penalty?"bad":"ok")+'">'+words+'</div></div>'+
       '<div class="stat"><div class="k">Minimum</div><div class="v" style="font-size:22px">'+w.minWords+'</div></div>'+
       '<div class="stat"><div class="k">Under-length penalty</div><div class="v" style="font-size:22px">'+(penalty?"Yes":"No")+'</div></div>'+
     '</div>'+
     (penalty?'<div class="notice">Answers below the word minimum are penalised under Task Achievement regardless of quality. Aim for roughly 20 words above the minimum, not far above — length alone earns nothing.</div>':"")+
     '<div class="model" style="white-space:pre-wrap;font-family:var(--ui)">'+esc(text||"(nothing written)")+'</div>'+
   '</div>'+
   '<div class="pane"><h2>Model answer</h2><div class="model" style="white-space:pre-line">'+esc(w.model)+'</div></div>'+
   '<div class="pane"><h2>What the examiner is looking for</h2><p style="color:var(--ink-2)">'+esc(w.tips)+'</p>'+
     '<h2 style="margin-top:18px">Band descriptors — the four criteria</h2>'+
     bandDescriptors(w.task)+
   '</div>'+
   '<div class="pane"><div class="btnrow"><button class="primary" onclick="openWritingMenu()">Another task</button><button onclick="home()">Home</button></div></div>';
  window.scrollTo(0,0);
}
function bandDescriptors(task){
  var rows=[
   ["Task "+(task===1?"Achievement":"Response"), task===1
     ? "Covers the requirements; presents a clear overview of main trends; highlights key features with accurate data."
     : "Addresses all parts of the question; presents a clear position throughout; extends and supports main ideas."],
   ["Coherence and Cohesion","Logical progression throughout; paragraphs used appropriately; cohesive devices used flexibly rather than mechanically."],
   ["Lexical Resource","Sufficient range for some flexibility and precision; some less common items; occasional errors in word choice or collocation."],
   ["Grammatical Range and Accuracy","A variety of complex structures; frequent error-free sentences; good control of grammar and punctuation."]
  ];
  return '<table><thead><tr><th>Criterion (25% each)</th><th>What band 7 looks like</th></tr></thead><tbody>'+
    rows.map(function(r){ return "<tr><td><b>"+esc(r[0])+"</b></td><td style='color:var(--ink-2)'>"+esc(r[1])+"</td></tr>"; }).join("")+'</tbody></table>';
}

/* ===================== SPEAKING ===================== */
function openSpeakingMenu(){
  chSub.textContent="Speaking";
  view.innerHTML='<div class="pane"><p class="eyebrow">Speaking</p><h1>Choose a part</h1>'+
   '<p class="lede">The speaking test lasts 11–14 minutes in three parts. Practise with the real timings — candidates most often lose marks in Part 2 by stopping after forty seconds.</p>'+
   '<div class="grid grid-3">'+SPEAKING.map(function(s,i){
     return '<div class="card pick" onclick="startSpeaking('+i+')" role="button" tabindex="0"><div class="n">PART '+s.part+'</div><h3>'+esc(s.title.replace(/^Part \d+ — /,""))+'</h3>'+
      '<p style="color:var(--ink-2);font-size:15.5px;margin:0">'+esc(s.note.slice(0,110))+'…</p></div>';
   }).join("")+'</div>'+
   '<div class="btnrow" style="margin-top:18px"><button onclick="home()">← Back</button></div></div>';
}
var SP={ t:null, left:0, rec:null, chunks:[], stream:null };
function startSpeaking(idx){
  S.mode="speaking"; S.test=SPEAKING[idx];
  chSub.textContent="Speaking — "+S.test.title;
  spStop();
  var s=S.test;
  if(s.part===2){
    var c=s.cards[Math.floor(Math.random()*s.cards.length)];
    view.innerHTML='<div class="pane"><p class="eyebrow">Part 2 · long turn</p><h1>Candidate task card</h1>'+
      '<div class="notice">'+esc(s.note)+'</div>'+
      '<div class="cue"><b>'+esc(c.task)+'</b><p style="margin:10px 0 0">You should say:</p><ul>'+c.bullets.map(function(b){return "<li>"+esc(b)+"</li>";}).join("")+'</ul></div>'+
      '<div class="big-timer" id="spTime">1:00</div><div class="phase" id="spPhase">Preparation — make notes</div>'+
      '<div class="btnrow" style="margin-top:14px;justify-content:center">'+
        '<button class="primary" onclick="spRun(\'prep\')">Start 1 min preparation</button>'+
        '<button onclick="spRun(\'answer\')">Skip to 2 min talk</button>'+
        '<button onclick="spNewCard()">New card</button>'+
        '<button onclick="spRecordToggle()" id="spRecBtn">● Record</button>'+
      '</div>'+
      '<div id="spAudio"></div>'+
      '<label class="fld" style="margin-top:18px"><span>Your notes</span><textarea rows="5" placeholder="Jot key words only — full sentences waste your minute."></textarea></label>'+
     '</div>'+
     '<div class="pane"><div class="btnrow"><button onclick="openSpeakingMenu()">← Back</button><button onclick="home()">Home</button></div></div>';
    return;
  }
  var set=s.sets[Math.floor(Math.random()*s.sets.length)];
  view.innerHTML='<div class="pane"><p class="eyebrow">Part '+s.part+'</p><h1>'+esc(set.topic)+'</h1>'+
    '<div class="notice">'+esc(s.note)+'</div>'+
    set.qs.map(function(q,i){ return '<div class="qrow"><div class="qn">QUESTION '+(i+1)+'</div><div class="qt">'+esc(q)+'</div></div>'; }).join("")+
    '<div class="big-timer" id="spTime">'+fmt(s.secs.answer)+'</div><div class="phase" id="spPhase">Answer time per question</div>'+
    '<div class="btnrow" style="margin-top:14px;justify-content:center">'+
      '<button class="primary" onclick="spRun(\'answer\')">Start timer</button>'+
      '<button onclick="startSpeaking('+idx+')">New topic</button>'+
      '<button onclick="spRecordToggle()" id="spRecBtn">● Record</button>'+
    '</div><div id="spAudio"></div>'+
   '</div>'+
   '<div class="pane"><div class="btnrow"><button onclick="openSpeakingMenu()">← Back</button><button onclick="home()">Home</button></div></div>';
}
function spNewCard(){ startSpeaking(SPEAKING.indexOf(S.test)); }
function spRun(phase){
  spStopTimer();
  var s=S.test, secs = phase==="prep" ? (s.secs.prep||60) : (s.secs.answer||120);
  var label = phase==="prep" ? "Preparation — make notes" : (s.part===2?"Speak now — aim for the full two minutes":"Answer time per question");
  document.getElementById("spPhase").textContent=label;
  SP.left=secs;
  var el=document.getElementById("spTime");
  var draw=function(){
    el.textContent=fmt(SP.left);
    el.classList.toggle("warn", SP.left<=10);
    if(SP.left<=0){
      spStopTimer();
      if(phase==="prep" && s.part===2){ spRun("answer"); return; }
      document.getElementById("spPhase").textContent="Time up";
    }
    SP.left--;
  };
  draw(); SP.t=setInterval(draw,1000);
}
function spStopTimer(){ if(SP.t){ clearInterval(SP.t); SP.t=null; } }
function spStop(){ spStopTimer(); if(SP.rec&&SP.rec.state==="recording") SP.rec.stop(); if(SP.stream) SP.stream.getTracks().forEach(function(t){t.stop();}); SP.stream=null; SP.rec=null; }
function spRecordToggle(){
  var btn=document.getElementById("spRecBtn");
  if(SP.rec&&SP.rec.state==="recording"){ SP.rec.stop(); return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ alert("Recording is not supported in this browser."); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    SP.stream=stream; SP.chunks=[];
    var r=new MediaRecorder(stream); SP.rec=r;
    r.ondataavailable=function(e){ if(e.data.size) SP.chunks.push(e.data); };
    r.onstop=function(){
      var blob=new Blob(SP.chunks,{type:r.mimeType||"audio/webm"});
      var url=URL.createObjectURL(blob);
      document.getElementById("spAudio").innerHTML='<audio controls src="'+url+'"></audio><p class="hint">Listen back for hesitation, repeated fillers and whether you answered every bullet point.</p>';
      btn.textContent="● Record"; btn.classList.remove("primary");
      if(SP.stream) SP.stream.getTracks().forEach(function(t){t.stop();});
      SP.stream=null;
    };
    r.start(); btn.textContent="■ Stop recording"; btn.classList.add("primary");
  }).catch(function(){ alert("Microphone access was refused."); });
}

/* ===================== VOCABULARY ===================== */
var VS={ i:0, flipped:false, order:[] };
function openVocab(){
  chSub.textContent="Academic vocabulary";
  VS.order=VOCAB.map(function(_,i){return i;}).sort(function(){return Math.random()-.5;});
  VS.i=0; VS.flipped=false; renderCard();
}
function renderCard(){
  var v=VOCAB[VS.order[VS.i]];
  view.innerHTML='<div class="pane">'+
    '<p class="eyebrow">Academic vocabulary · card '+(VS.i+1)+' of '+VOCAB.length+'</p>'+
    '<div class="flash" onclick="flipCard()" role="button" tabindex="0" onkeydown="if(event.key===\' \'||event.key===\'Enter\'){event.preventDefault();flipCard()}">'+
      (VS.flipped
        ? '<div class="word">'+esc(v.w)+'</div><div class="pos">'+esc(v.pos)+'</div>'+
          '<div class="def">'+esc(v.def)+'</div><div class="ex">"'+esc(v.ex)+'"</div>'+
          '<div class="coll">'+esc(v.coll)+'</div>'
        : '<div class="word">'+esc(v.w)+'</div><div class="pos">'+esc(v.pos)+'</div><div class="tap">click or press space to reveal</div>')+
    '</div>'+
    '<div class="btnrow" style="margin-top:16px;justify-content:center">'+
      '<button onclick="cardStep(-1)">← Previous</button>'+
      '<button class="primary" onclick="flipCard()">'+(VS.flipped?"Hide":"Reveal")+'</button>'+
      '<button onclick="cardStep(1)">Next →</button>'+
      '<button onclick="openVocab()">Shuffle</button>'+
      '<button onclick="vocabList()">View all as a list</button>'+
    '</div>'+
   '</div>'+
   '<div class="pane"><div class="btnrow"><button onclick="home()">← Home</button></div></div>';
}
function flipCard(){ VS.flipped=!VS.flipped; renderCard(); }
function cardStep(d){ VS.i=(VS.i+d+VOCAB.length)%VOCAB.length; VS.flipped=false; renderCard(); }
function vocabList(){
  view.innerHTML='<div class="pane"><p class="eyebrow">Academic vocabulary</p><h1>All '+VOCAB.length+' words</h1>'+
   '<table><thead><tr><th>Word</th><th>Part of speech</th><th>Meaning</th><th>Collocations</th></tr></thead><tbody>'+
   VOCAB.map(function(v){ return "<tr><td><b>"+esc(v.w)+"</b></td><td class='num'>"+esc(v.pos)+"</td><td style='color:var(--ink-2)'>"+esc(v.def)+"</td><td style='color:var(--accent);font-family:var(--mono);font-size:13.5px'>"+esc(v.coll)+"</td></tr>"; }).join("")+
   '</tbody></table>'+
   '<div class="btnrow" style="margin-top:18px"><button class="primary" onclick="openVocab()">Back to flashcards</button><button onclick="home()">Home</button></div></div>';
}

/* ===================== BAND TABLES ===================== */
function openBands(){
  chSub.textContent="Band score tables";
  var read=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4]];
  var list=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4]];
  var mk=function(T){ return '<table><thead><tr><th>Raw score out of 40</th><th>Band</th></tr></thead><tbody>'+
     T.map(function(r,i){ var hi=i===0?40:T[i-1][0]-1; return "<tr><td class='num'>"+r[0]+(hi>r[0]?"–"+hi:"")+"</td><td><b>"+r[1].toFixed(1)+"</b></td></tr>"; }).join("")+'</tbody></table>'; };
  view.innerHTML='<div class="pane"><p class="eyebrow">Scoring</p><h1>How raw scores become bands</h1>'+
    '<p class="lede">Reading and Listening are marked out of 40 and converted to a band. Writing and Speaking are marked directly on the nine-band scale against four criteria worth 25 per cent each.</p>'+
    '<div class="grid grid-2">'+
      '<div><h2>Academic Reading</h2>'+mk(read)+'</div>'+
      '<div><h2>Listening</h2>'+mk(list)+'</div>'+
    '</div></div>'+
   '<div class="pane"><h2>Overall band</h2>'+
    '<p style="color:var(--ink-2)">The overall band is the mean of the four skill bands, rounded to the nearest half band. A mean ending in .25 rounds up to the next half band; a mean ending in .75 rounds up to the next whole band.</p>'+
    '<table><thead><tr><th>Listening</th><th>Reading</th><th>Writing</th><th>Speaking</th><th>Mean</th><th>Overall</th></tr></thead><tbody>'+
      '<tr><td class="num">6.5</td><td class="num">6.5</td><td class="num">5.0</td><td class="num">7.0</td><td class="num">6.25</td><td><b>6.5</b></td></tr>'+
      '<tr><td class="num">4.0</td><td class="num">3.5</td><td class="num">4.0</td><td class="num">4.0</td><td class="num">3.875</td><td><b>4.0</b></td></tr>'+
      '<tr><td class="num">6.5</td><td class="num">6.5</td><td class="num">5.5</td><td class="num">6.0</td><td class="num">6.125</td><td><b>6.0</b></td></tr>'+
    '</tbody></table>'+
    '<div class="notice" style="margin-top:16px">Most European universities ask for an overall 6.5 with no band below 6.0. Because a single weak skill can block an application even when the overall is met, the band you should practise hardest is your lowest one — not your favourite.</div>'+
    '<div class="btnrow"><button onclick="home()">← Home</button></div></div>';
}

/* boot */
if("speechSynthesis" in window) speechSynthesis.getVoices();
home();
</script>
